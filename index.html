<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFire</title>
  <link rel="stylesheet" href="asset/bootstrap.min.css">
  <script src="asset/bootstrap.bundle.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">.StreamFire</a>
      <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse"
        data-bs-target="#collapsibleNavId" aria-controls="collapsibleNavId" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <!-- Modal vidéo -->
  <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark">
        <div class="modal-header border-0">
          <h5 class="modal-title text-white">Lecture du film</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <video id="filmVideo" class="w-100" controls>
            <source src="ressource/video.mp4" type="video/mp4">
            Votre navigateur ne supporte pas la lecture vidéo.
          </video>
        </div>
      </div>
    </div>
  </div>



  <div class="container-sm">
    <section id="galerie" class="py-5">
      <div class="container">
        <h2 class="mb-4 text-center">Galerie de Films</h2>
        <div class="row mb-4">
          <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un film..." />
          </div>
          <div class="col-md-6">
            <select id="categorySelect" class="form-select">
              <option value="all">Toutes les catégories</option>
              <option value="Action">Action</option>
              <option value="Drame">Drame</option>
              <option value="Science-Fiction">Science-Fiction</option>
              <option value="Animation">Animation</option>
              <option value="Thriller">Thriller</option>
            </select>
          </div>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 gallery-row" id="galleryContainer">
          <!-- Les films seront insérés ici dynamiquement -->
        </div>
      </div>
    </section>

    <script src="scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

</div>

<footer class="text-center p-2 text-white bg-success position-fixed bottom-0 w-100">
  Tous droits reservés StreamFire@site.com 2025
</footer>

<script src="asset/app.js"></script>

</body>

</html>
